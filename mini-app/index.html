<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/sonya-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="description" content="SleepCore - Дыхательные упражнения для здорового сна" />
    <!--
      Content Security Policy (CSP) - OWASP Best Practices 2025
      - default-src 'self': Baseline restriction
      - script-src: Allow self + Telegram SDK + inline for Vite
      - style-src: Allow inline styles (Tailwind)
      - font-src: Self-hosted Inter Variable font
      - img-src: Self + data URIs + external images
      - connect-src: API endpoints + WebSocket
      - frame-ancestors: Only Telegram can embed
      - object-src 'none': Prevent plugin attacks
      - base-uri 'self': Prevent base tag injection
      - form-action 'self': Prevent form hijacking
      @see https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:* https://*.sleepcore.app wss://*.sleepcore.app https://*.sentry.io; frame-ancestors 'self' https://web.telegram.org https://t.me; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <title>SleepCore</title>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Fonts loaded via @fontsource-variable/inter (self-hosted, no external requests) -->
  </head>
  <body class="bg-night-900 text-night-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
