# SleepCore Companion App - Version Catalog
# ==========================================
# Dependency versions based on research (February 2026)

[versions]
# Android SDK
# Health Connect 1.1.0 requires compileSdk 36 and AGP 8.9.1+
compileSdk = "36"
minSdk = "28"  # Health Connect requires Android 9 (API 28)+
targetSdk = "35"  # Keep targetSdk at 35 for now (opt-in to new behavior separately)

# Core
agp = "8.9.1"  # Required for Health Connect 1.1.0
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"

# AndroidX
coreKtx = "1.15.0"
lifecycleRuntime = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigation = "2.8.5"
work = "2.10.0"
datastore = "1.1.1"
securityCrypto = "1.1.0-alpha06"  # EncryptedSharedPreferences

# Health Connect - Stable 1.1.0 (October 2025)
# Source: https://mvnrepository.com/artifact/androidx.health.connect/connect-client/1.1.0
healthConnect = "1.1.0"

# Networking
retrofit = "2.11.0"
okhttp = "4.12.0"
kotlinxSerialization = "1.7.3"

# DI
hilt = "2.54"
hiltNavigation = "1.2.0"

# Coroutines
coroutines = "1.9.0"

# Room - HIPAA Audit Trail persistent storage
room = "2.6.1"

# Security - Tink for robust encryption (Google's crypto library)
tink = "1.15.0"

# Sentry - Crash reporting & performance monitoring (HIPAA BAA available)
# Gradle Plugin: 6.1.0 (Feb 2026) - github.com/getsentry/sentry-android-gradle-plugin/releases
# SDK: 8.16.0 (Feb 2026) - search.maven.org/artifact/io.sentry/sentry-android
sentryPlugin = "6.1.0"
sentrySdk = "8.16.0"

# Biometric - HIPAA-compliant authentication
biometric = "1.2.0-alpha05"

# Testing
junit = "4.13.2"
junitVersion = "1.2.1"
testCore = "1.6.1"  # ApplicationProvider for Robolectric tests
espresso = "3.6.1"
mockk = "1.13.13"
turbine = "1.2.0"
archCoreTesting = "2.2.0"
robolectric = "4.14.1"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntime" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleRuntime" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# WorkManager - For background sync (research: 15 min minimum interval)
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# DataStore & Security - For secure token storage
# Migration from EncryptedSharedPreferences to DataStore + Tink (Feb 2026)
# Tink: Google's multi-language crypto library, more robust than KeyStore-based solutions
androidx-datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }

# Biometric - HIPAA-compliant authentication
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }

# Health Connect - Research: SDK 1.1.0 stable, Android 14+ native integration
androidx-health-connect = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }

# Networking
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-core = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Hilt DI
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigation" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltNavigation" }
hilt-work-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltNavigation" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Room - HIPAA Audit Trail (persistent immutable logs)
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Sentry - Crash reporting & performance monitoring
sentry-android = { group = "io.sentry", name = "sentry-android", version.ref = "sentrySdk" }
sentry-compose = { group = "io.sentry", name = "sentry-compose-android", version.ref = "sentrySdk" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "testCore" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCoreTesting" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
androidx-compose-ui-test = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sentry = { id = "io.sentry.android.gradle", version.ref = "sentryPlugin" }
