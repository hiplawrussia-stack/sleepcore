# Codecov Configuration
# =====================
# https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%        # Require 80% coverage
        threshold: 2%      # Allow 2% decrease in PR
        if_ci_failed: error

    patch:
      default:
        target: 80%        # New code must have 80% coverage
        threshold: 5%

# Stricter requirements for security-critical code
flags:
  android:
    paths:
      - android-companion/app/src/main/java/
    carryforward: true

# Ignore generated code
ignore:
  - "**/*_Factory.kt"
  - "**/*_HiltModules.kt"
  - "**/*_Impl.kt"
  - "**/BuildConfig.kt"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
